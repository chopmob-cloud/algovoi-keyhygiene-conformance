# 12-way key-hygiene consensus — enforce byte-for-byte parity on every push.
#
# Runs all twelve independent language runners against the one frozen, signed
# corpus (keyhygiene_v0) via tools/run_consensus.sh --require 12. The job fails
# unless every runner reproduces every verdict AND all twelve are present: a
# missing toolchain shrinks N below --require and fails closed, so the field can
# never silently shrink while still "passing". The KAT integrity gate (signed
# head + independent re-derivation of every verdict) runs first.
name: 12-way consensus

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consensus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consensus:
    name: keyhygiene_v0 (require 12)
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet pynacl   # KAT signed-head verification

      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: shivammathur/setup-php@v2
        with: { php-version: "8.3", extensions: gmp }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.2" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "9.0.x" }
      - uses: erlef/setup-beam@v1
        with: { otp-version: "26", elixir-version: "1.16" }

      - name: C deps (GMP + jansson)
        run: sudo apt-get update -q && sudo apt-get install -y -q libgmp-dev libjansson-dev pkg-config

      - name: Kotlin compiler
        run: |
          set -euo pipefail
          KV=2.0.20
          curl -fsSL -o /tmp/kotlin.zip "https://github.com/JetBrains/kotlin/releases/download/v${KV}/kotlin-compiler-${KV}.zip"
          sudo unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Scala CLI
        run: |
          set -euo pipefail
          curl -fsLo /tmp/scala-cli.gz https://github.com/VirtusLab/scala-cli/releases/latest/download/scala-cli-x86_64-pc-linux.gz
          gzip -df /tmp/scala-cli.gz && chmod +x /tmp/scala-cli && sudo mv /tmp/scala-cli /usr/local/bin/scala-cli

      # JSON jar for the JVM runners (java, kotlin) — org.json, from Maven Central
      - name: org.json jar
        run: |
          curl -fsSL https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar -o /tmp/json.jar
          echo "KEYHYGIENE_JSON_JAR=/tmp/json.jar" >> "$GITHUB_ENV"

      - name: Run 12-way consensus
        run: bash tools/run_consensus.sh --require 12
